<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="800" height="500" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" font-size="13" fill="#717171" font-weight="500" letter-spacing="0.5">Multi-Axis Violation Model</text>

  <!-- Spoke lines -->
  <line x1="400" y1="220" x2="400" y2="92" stroke="#DDE0E5" stroke-width="1.5"/>
  <line x1="400" y1="220" x2="610" y2="130" stroke="#DDE0E5" stroke-width="1.5"/>
  <line x1="400" y1="220" x2="610" y2="330" stroke="#DDE0E5" stroke-width="1.5"/>
  <line x1="400" y1="220" x2="190" y2="330" stroke="#DDE0E5" stroke-width="1.5"/>
  <line x1="400" y1="220" x2="190" y2="130" stroke="#DDE0E5" stroke-width="1.5"/>

  <!-- Center circle -->
  <circle cx="400" cy="220" r="68" fill="#049FD9"/>
  <text x="400" y="213" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="700">Security</text>
  <text x="400" y="231" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="700">Violations</text>

  <!-- Node: Top Leafs (top) -->
  <rect x="320" y="52" width="160" height="52" rx="6" fill="#FFFFFF" stroke="#DDE0E5" stroke-width="1.5"/>
  <text x="400" y="74" text-anchor="middle" font-size="12" fill="#1A1A1A" font-weight="600">Top Leafs</text>
  <text x="400" y="93" text-anchor="middle" font-size="11" fill="#717171">Network Leaf Nodes</text>

  <!-- Node: Top Tenants (top-right) -->
  <rect x="608" y="100" width="162" height="52" rx="6" fill="#FFFFFF" stroke="#DDE0E5" stroke-width="1.5"/>
  <text x="689" y="122" text-anchor="middle" font-size="12" fill="#1A1A1A" font-weight="600">Top Tenants</text>
  <text x="689" y="141" text-anchor="middle" font-size="11" fill="#717171">Policy Tenants</text>

  <!-- Node: Top App Profiles (bottom-right) -->
  <rect x="608" y="300" width="162" height="52" rx="6" fill="#FFFFFF" stroke="#DDE0E5" stroke-width="1.5"/>
  <text x="689" y="322" text-anchor="middle" font-size="12" fill="#1A1A1A" font-weight="600">Top App Profiles</text>
  <text x="689" y="341" text-anchor="middle" font-size="11" fill="#717171">Application Groups</text>

  <!-- Node: Top EPGs (bottom-left) -->
  <rect x="30" y="300" width="162" height="52" rx="6" fill="#FFFFFF" stroke="#DDE0E5" stroke-width="1.5"/>
  <text x="111" y="322" text-anchor="middle" font-size="12" fill="#1A1A1A" font-weight="600">Top EPGs</text>
  <text x="111" y="341" text-anchor="middle" font-size="11" fill="#717171">Endpoint Groups</text>

  <!-- Node: Top EPG Pairs (top-left) -->
  <rect x="30" y="100" width="162" height="52" rx="6" fill="#FFFFFF" stroke="#DDE0E5" stroke-width="1.5"/>
  <text x="111" y="122" text-anchor="middle" font-size="12" fill="#1A1A1A" font-weight="600">Top EPG Pairs</text>
  <text x="111" y="141" text-anchor="middle" font-size="11" fill="#717171">Communication Pairs</text>

  <!-- Bottom italic text -->
  <text x="400" y="440" text-anchor="middle" font-size="13" fill="#717171" font-style="italic">Engineers choose their own triage entry point</text>
  <text x="400" y="462" text-anchor="middle" font-size="12" fill="#DDE0E5">— any axis surfaces the same underlying violations —</text>
</svg>
