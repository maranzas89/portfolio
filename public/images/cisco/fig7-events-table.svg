  <text x="450" y="247" text-anchor="middle" font-size="10" fill="#717171">Taboo • dev-tenant</text>
  <rect x="620" y="223" width="80" height="20" rx="4" fill="#FFFFFF"/>
  <text x="660" y="237" text-anchor="middle" font-size="11" fill="#1A1A1A" font-weight="500">mgmt-epg</text>
  <rect x="742" y="223" width="80" height="20" rx="4" fill="#FFFFFF"/>
  <text x="782" y="237" text-anchor="middle" font-size="11" fill="#1A1A1A" font-weight="500">infra-epg</text>
