  <text x="220" y="161" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="monospace">AV:DENY_DROP_0403</text>
  <text x="450" y="157" text-anchor="middle" font-size="12" fill="#1A1A1A">Zoning rule deny — traffic blocked</text>
