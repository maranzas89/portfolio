  <rect x="800" y="315" width="24" height="18" rx="4" fill="#FFFFFF" stroke="#DDE0E5" stroke-width="1"/>
  <text x="812" y="328" text-anchor="middle" font-size="11" fill="#717171">2</text>
  <rect x="830" y="315" width="24" height="18" rx="4" fill="#FFFFFF" stroke="#DDE0E5" stroke-width="1"/>
  <text x="842" y="328" text-anchor="middle" font-size="11" fill="#717171">3</text>
  <rect x="860" y="315" width="24" height="18" rx="4" fill="#FFFFFF" stroke="#DDE0E5" stroke-width="1"/>
  <text x="872" y="328" text-anchor="middle" font-size="12" fill="#717171">→</text>
