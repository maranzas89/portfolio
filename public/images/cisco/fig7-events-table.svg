<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="900" height="350" fill="#FFFFFF"/>

  <!-- ═══ HEADER AREA ═══ -->
  <text x="30" y="38" font-size="18" fill="#1A1A1A" font-weight="700">Tenant Security Events</text>
  <!-- Badge: 10 total events -->
  <rect x="224" y="20" width="130" height="26" rx="13" fill="#EEF0F4" stroke="#DDE0E5" stroke-width="1"/>
  <circle cx="242" cy="33" r="5" fill="#049FD9"/>
  <text x="296" y="38" text-anchor="middle" font-size="12" fill="#1B2A3D" font-weight="600">10 total events</text>
  <!-- Filter/search area -->
  <rect x="620" y="18" width="180" height="28" rx="6" fill="#F5F6F8" stroke="#DDE0E5" stroke-width="1"/>
