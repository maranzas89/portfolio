  <circle cx="62" cy="271" r="6" fill="#27AE60"/>
  <rect x="74" y="261" width="34" height="20" rx="10" fill="#E8F8F0"/>
  <text x="91" y="275" text-anchor="middle" font-size="10" fill="#27AE60" font-weight="600">Info</text>
  <text x="220" y="275" text-anchor="middle" font-size="11" fill="#1A1A1A" font-family="monospace">AV:INFO_VRF_0054</text>
  <text x="450" y="271" text-anchor="middle" font-size="12" fill="#1A1A1A">VRF route leak — informational</text>
  <text x="450" y="285" text-anchor="middle" font-size="10" fill="#717171">VRF Policy • corp-tenant</text>
  <rect x="620" y="261" width="80" height="20" rx="4" fill="#F5F6F8"/>
  <text x="660" y="275" text-anchor="middle" font-size="11" fill="#1A1A1A" font-weight="500">vrf-a-epg</text>
