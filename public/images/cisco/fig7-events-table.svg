  <text x="782" y="199" text-anchor="middle" font-size="11" fill="#1A1A1A" font-weight="500">backend-api</text>
  <line x1="31" y1="214" x2="869" y2="214" stroke="#DDE0E5" stroke-width="0.5"/>

  <!-- ─── Row 4 (gray bg) ─── -->
  <rect x="31" y="214" width="838" height="38" fill="#F5F6F8"/>
  <circle cx="62" cy="233" r="6" fill="#F1C40F"/>
