  <text x="660" y="88" text-anchor="middle" font-size="11" fill="#A0AEC0" font-weight="600" letter-spacing="0.3">PROVIDER EPG</text>
  <text x="810" y="88" text-anchor="middle" font-size="11" fill="#A0AEC0" font-weight="600" letter-spacing="0.3">CONSUMER EPG</text>

